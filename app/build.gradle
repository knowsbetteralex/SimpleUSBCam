plugins {
    id 'com.android.application'
}
android {
    namespace 'com.knowsbetteralex.simpleusbcam'
    compileSdk 36
    defaultConfig {
        applicationId 'com.knowsbetteralex.simpleusbcam'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.github.ernestp.AndroidUSBCamera:libausbc:3.6.0'
}
